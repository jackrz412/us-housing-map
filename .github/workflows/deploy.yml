name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by refresh.yml after it commits new data. Its push uses the
  # workflow's GITHUB_TOKEN, and GitHub doesn't let those pushes trigger
  # other workflows, so the refresh calls this one directly.
  workflow_call:

# Pages deploys need these; nothing else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits rather than cancelling a deploy
# that's already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always build main's latest commit. When called from refresh.yml,
      # github.sha is the commit the refresh *started* from, which doesn't
      # include the data it just committed.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Validate the committed data before publishing it. The pipeline itself
      # runs in refresh.yml.
      - name: Validate processed data
        run: python3 pipeline/validate.py

      - name: Build _site
        run: scripts/build_site.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
