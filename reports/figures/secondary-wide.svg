<text x="685.2" y="30.5" class="fig-text fig-halo" font-size="13" text-anchor="start">+0.34</text>
<text x="284.0" y="66.5" class="fig-text" font-size="13" text-anchor="end">Lower median income</text>
<line x1="551.0" y1="62.0" x2="641.1" y2="62.0" class="fig-ci" style="stroke: var(--color-text); --i: 1" stroke-width="2" stroke-linecap="round"/>
