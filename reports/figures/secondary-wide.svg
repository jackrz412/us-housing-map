<line x1="350.6" y1="206.0" x2="442.8" y2="206.0" class="fig-ci" style="stroke: var(--color-text); --i: 5" stroke-width="2" stroke-linecap="round"/>
<circle cx="397.1" cy="206.0" r="8" class="fig-dot" style="fill: var(--color-text); stroke: var(--color-bg); --i: 5" stroke-width="2"/>
<text x="342.6" y="210.5" class="fig-text fig-halo" font-size="13" text-anchor="end">-0.12</text>
<text x="284.0" y="246.5" class="fig-text" font-size="13" text-anchor="end">Owners paying 30%+ of income on housing</text>
<line x1="337.7" y1="242.0" x2="431.1" y2="242.0" class="fig-ci" style="stroke: var(--color-text); --i: 6" stroke-width="2" stroke-linecap="round"/>
<circle cx="382.2" cy="242.0" r="8" class="fig-dot" style="fill: var(--color-text); stroke: var(--color-bg); --i: 6" stroke-width="2"/>
