<text x="309.2" y="210.5" class="fig-text fig-halo" font-size="13" text-anchor="end">-0.12</text>
<text x="246.0" y="246.5" class="fig-text" font-size="13" text-anchor="end">Owners paying 30%+ of income on housing</text>
<line x1="303.2" y1="242.0" x2="404.9" y2="242.0" class="fig-ci" style="stroke: var(--color-text); --i: 6" stroke-width="2" stroke-linecap="round"/>
<circle cx="351.7" cy="242.0" r="8" class="fig-dot" style="fill: var(--color-text); stroke: var(--color-bg); --i: 6" stroke-width="2"/>
