<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 306" width="736" height="306" role="img" aria-labelledby="secondary-wide-title secondary-wide-desc">
<title id="secondary-wide-title">Partial rank correlation with 2023–2025 delinquency, controlling for each county&#x27;s 2017–2019 level. Bars are 95% bootstrap intervals.</title>
<desc id="secondary-wide-desc">Dot plot of seven measures. Loans above 90% loan-to-value have the strongest positive association (+0.34), followed by lower median income (+0.27) and applications denied for debt-to-income (+0.23). The Burden score is about zero (+0.01), and new buyers&#x27; payment-to-income (-0.12) and owners paying 30%+ of income (-0.14) are negative.</desc>
<style>
  .fig-text { font-family: var(--font-sans); fill: var(--color-text); }
  .fig-muted { font-family: var(--font-sans); fill: var(--color-muted); }
  .fig-title { font-family: var(--font-sans); font-weight: var(--weight-semibold); fill: var(--color-text); }
  .fig-grid { stroke: var(--color-border); stroke-width: 1; }
  .fig-zero { stroke: var(--color-muted); stroke-width: 1.5; }
  .fig-halo { paint-order: stroke; stroke: var(--color-bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
<line x1="352.5" y1="4" x2="352.5" y2="260" class="fig-grid"/>
<line x1="405.0" y1="4" x2="405.0" y2="260" class="fig-grid"/>
<line x1="510.0" y1="4" x2="510.0" y2="260" class="fig-grid"/>
<line x1="562.5" y1="4" x2="562.5" y2="260" class="fig-grid"/>
<line x1="615.0" y1="4" x2="615.0" y2="260" class="fig-grid"/>
<line x1="667.5" y1="4" x2="667.5" y2="260" class="fig-grid"/>
<line x1="457.5" y1="4" x2="457.5" y2="260" class="fig-zero"/>
<text x="352.5" y="276.0" class="fig-muted" font-size="13" text-anchor="middle">-0.2</text>
<text x="457.5" y="276.0" class="fig-muted" font-size="13" text-anchor="middle">0</text>
<text x="562.5" y="276.0" class="fig-muted" font-size="13" text-anchor="middle">+0.2</text>
<text x="667.5" y="276.0" class="fig-muted" font-size="13" text-anchor="middle">+0.4</text>
<text x="510.0" y="298.0" class="fig-muted" font-size="13" text-anchor="middle">Partial rank correlation (positive = higher measure, higher later delinquency)</text>
<text x="284.0" y="30.5" class="fig-text" font-size="13" text-anchor="end">Loans above 90% loan-to-value</text>
<line x1="589.5" y1="26.0" x2="677.2" y2="26.0" class="fig-ci" style="stroke: var(--color-text); --i: 0" stroke-width="2" stroke-linecap="round"/>
