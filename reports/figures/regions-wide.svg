<text x="600.5" y="154.5" class="fig-text fig-halo" font-size="13" text-anchor="start">31%</text>
<path d="M438.0,176.0 H629.6 A4,4 0 0 1 633.6,180.0 V188.0 A4,4 0 0 1 629.6,192.0 H438.0 Z" class="fig-bar" style="fill: var(--chart-equity); --i: 9"/>
<text x="639.6" y="188.5" class="fig-text fig-halo" font-size="13" text-anchor="start">38%</text>
</svg>
