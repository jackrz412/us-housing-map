<line x1="692.0" y1="27" x2="692.0" y2="201" class="fig-grid"/>
<text x="692.0" y="217.0" class="fig-muted" font-size="13" text-anchor="middle">50%</text>
<path d="M438.0,40.0 H512.2 A4,4 0 0 1 516.2,44.0 V52.0 A4,4 0 0 1 512.2,56.0 H438.0 Z" class="fig-bar" style="fill: var(--chart-equity); --i: 5"/>
<text x="522.2" y="52.5" class="fig-text fig-halo" font-size="13" text-anchor="start">15%</text>
<path d="M438.0,74.0 H567.1 A4,4 0 0 1 571.1,78.0 V86.0 A4,4 0 0 1 567.1,90.0 H438.0 Z" class="fig-bar" style="fill: var(--chart-equity); --i: 6"/>
<text x="577.1" y="86.5" class="fig-text fig-halo" font-size="13" text-anchor="start">26%</text>
<path d="M438.0,108.0 H554.9 A4,4 0 0 1 558.9,112.0 V120.0 A4,4 0 0 1 554.9,124.0 H438.0 Z" class="fig-bar" style="fill: var(--chart-equity); --i: 7"/>
<text x="564.9" y="120.5" class="fig-text fig-halo" font-size="13" text-anchor="start">24%</text>
