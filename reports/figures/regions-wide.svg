<text x="522.2" y="72.5" class="fig-text fig-halo" font-size="13" text-anchor="start">15%</text>
<path d="M438.0,94.0 H567.1 A4,4 0 0 1 571.1,98.0 V106.0 A4,4 0 0 1 567.1,110.0 H438.0 Z" class="fig-bar" style="fill: var(--chart-equity); --i: 6"/>
<text x="577.1" y="106.5" class="fig-text fig-halo" font-size="13" text-anchor="start">26%</text>
<path d="M438.0,128.0 H554.9 A4,4 0 0 1 558.9,132.0 V140.0 A4,4 0 0 1 554.9,144.0 H438.0 Z" class="fig-bar" style="fill: var(--chart-equity); --i: 7"/>
