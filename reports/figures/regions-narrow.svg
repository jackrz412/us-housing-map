<text x="100.0" y="313.5" class="fig-text" font-size="13" text-anchor="end">Pacific</text>
<path d="M112.0,301.0 H170.2 A4,4 0 0 1 174.2,305.0 V313.0 A4,4 0 0 1 170.2,317.0 H112.0 Z" class="fig-bar" style="fill: var(--chart-equity); --i: 5"/>
<text x="180.2" y="313.5" class="fig-text fig-halo" font-size="13" text-anchor="start">15%</text>
<text x="100.0" y="347.5" class="fig-text" font-size="13" text-anchor="end">Mountain</text>
<path d="M112.0,335.0 H213.8 A4,4 0 0 1 217.8,339.0 V347.0 A4,4 0 0 1 213.8,351.0 H112.0 Z" class="fig-bar" style="fill: var(--chart-equity); --i: 6"/>
<text x="223.8" y="347.5" class="fig-text fig-halo" font-size="13" text-anchor="start">26%</text>
<text x="100.0" y="381.5" class="fig-text" font-size="13" text-anchor="end">Northeast</text>
<path d="M112.0,369.0 H204.2 A4,4 0 0 1 208.2,373.0 V381.0 A4,4 0 0 1 204.2,385.0 H112.0 Z" class="fig-bar" style="fill: var(--chart-equity); --i: 7"/>
