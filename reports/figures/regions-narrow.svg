<text x="100.0" y="449.5" class="fig-text" font-size="13" text-anchor="end">Midwest</text>
<path d="M112.0,437.0 H263.5 A4,4 0 0 1 267.5,441.0 V449.0 A4,4 0 0 1 263.5,453.0 H112.0 Z" class="fig-bar" style="fill: var(--chart-equity); --i: 9"/>
<text x="273.5" y="449.5" class="fig-text fig-halo" font-size="13" text-anchor="start">39%</text>
