<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358 418" width="358" height="418" role="img" aria-labelledby="secondary-narrow-title secondary-narrow-desc">
<title id="secondary-narrow-title">Partial rank correlation with 2023–2025 delinquency, controlling for each county&#x27;s 2017–2019 level. Bars are 95% bootstrap intervals.</title>
<desc id="secondary-narrow-desc">Dot plot of seven measures. Loans above 90% loan-to-value have the strongest positive association (+0.34), followed by lower median income (+0.27) and applications denied for debt-to-income (+0.23). The Burden score is about zero (+0.01), and new buyers&#x27; payment-to-income (-0.12) and owners paying 30%+ of income (-0.14) are negative.</desc>
